<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>配信カレンダー | SPARKLECHAT</title><link rel="stylesheet" href="calendar.css?v=2"></head>
<body class="calendar-editor"><header class="top"><a href="./" class="brand">✦ SPARKLE<span>CHAT</span></a><span>配信のおへやづくり</span></header>
<main class="layout"><section class="intro"><div><p class="eyebrow">STREAM PLANNER</p><h1>配信カレンダー</h1><p>予定を入れたい日をクリック。シールを貼って、ひとこと書くだけ。</p></div><a href="./" class="back">← ウィジェットに戻る</a></section>
<section class="editor-card"><div class="calendar-toolbar"><div><p class="eyebrow">MY SCHEDULE</p><h2 id="month-title"></h2></div><div class="month-actions"><button id="previous" aria-label="前の月">‹</button><button id="today">今月</button><button id="next" aria-label="次の月">›</button></div></div><div class="sticker-guide" aria-label="シールの意味"><span>♥ 配信</span><span>× お休み</span><span>🎮 ゲーム</span><span>☕ 雑談</span><span>🍷 お酒</span></div><div class="weekdays"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div id="calendar-grid" class="calendar-grid"></div></section>
<aside class="edit-card"><h2 id="selected-title">日付を選んでください</h2><p>カレンダーの空白を押すと、この日の予定を編集できます。</p><div id="day-editor" hidden><div class="stickers" role="group" aria-label="予定のシール"><button data-kind="stream" type="button">♥<small>配信</small></button><button data-kind="rest" type="button">×<small>休み</small></button><button data-kind="game" type="button">🎮<small>ゲーム</small></button><button data-kind="chat" type="button">☕<small>雑談</small></button><button data-kind="drink" type="button">🍷<small>お酒</small></button></div><label for="event-text">予定のメモ</label><textarea id="event-text" maxlength="90" rows="3" placeholder="例：21:00〜 新作ゲームを遊ぶ"></textarea><button id="clear-day" class="quiet" type="button">この日の予定を消す</button></div><div class="publish"><h3>OBS用カレンダー</h3><p>このカレンダーだけのURLを発行します。「まとめ」とは別のブラウザソースに貼れます。</p><button id="publish" type="button">専用URLを発行・コピー</button><input id="obs-url" aria-label="OBS用カレンダーURL" readonly placeholder="発行したURLがここに表示されます"><p id="save-status" role="status">編集内容はこの端末に下書き保存されます。</p></div></aside></main><script type="module" src="calendar.js?v=3"></script></body></html>

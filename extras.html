<!doctype html>
<html lang="ja" data-page="extras">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPARKLECHAT — Telop &amp; Slideshow Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=M+PLUS+Rounded+1c:wght@700;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@500;700;900&family=Poppins:wght@600;800&family=DotGothic16&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="extras.css?v=2">
</head>
<body class="font-maru">
  <!-- slideshow image -->
  <div class="slide" id="slide" aria-hidden="true">
    <img class="slide__img" id="slide-img" alt="">
  </div>

  <!-- telop banner -->
  <div class="telop" id="telop" aria-hidden="true">
    <span class="telop__label" id="telop-label"></span>
    <div class="telop__view" id="telop-view">
      <span class="telop__text" id="telop-text"></span>
    </div>
  </div>

    await import('./extras.js?v=2');
